<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fit Calendar</title>
  <style>
    :root {
      --ink: #17201a;
      --muted: #68756d;
      --paper: #fffefa;
      --soft: #f6f7f2;
      --line: #dde6d8;
      --green: #1f6b4d;
      --green-2: #e7f3ea;
      --blue: #246b9b;
      --red: #d04a42;
      --amber: #b7791f;
      --violet: #6d5bd0;
      --mint: #8ed1b2;
      --sky: #88bfe8;
      --peach: #efb07f;
      --shadow: 0 18px 44px rgba(32, 40, 28, .1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(31,107,77,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(36,107,155,.045) 1px, transparent 1px),
        linear-gradient(135deg, #f8faf2 0%, #edf7f4 42%, #fff4e8 100%);
      background-size: 34px 34px, 34px 34px, auto;
      color: var(--ink);
    }

    button, input, select { font: inherit; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: linear-gradient(135deg, #1f6b4d, #2f8a62);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(31, 107, 77, .18);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(31, 107, 77, .22); }
    button.secondary { background: #e7eee3; color: var(--ink); }
    button.ghost { background: transparent; color: var(--green); border: 1px solid var(--line); }
    button.danger { background: var(--red); }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: white;
      color: var(--ink);
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    input:focus, select:focus { outline: 0; border-color: #78b992; box-shadow: 0 0 0 4px rgba(31,107,77,.11); }
    label { display: block; margin: 10px 0 6px; color: var(--muted); font-size: 13px; }

    .app { max-width: 1460px; margin: 0 auto; padding: 24px; }
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px 14px;
      background: rgba(255, 254, 250, .78);
      border: 1px solid rgba(221, 230, 216, .9);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 34px rgba(32,40,28,.08);
    }
    .brand { font-size: 34px; font-weight: 900; letter-spacing: 0; }
    .brand span {
      color: var(--green);
      background: linear-gradient(135deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .userbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .pill { border: 1px solid var(--line); background: rgba(255,255,255,.8); border-radius: 999px; padding: 9px 13px; color: var(--muted); }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 254, 250, .97), rgba(255, 254, 250, .9));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--peach));
      opacity: .82;
    }
    .flat { box-shadow: none; background: white; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .workspace { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
    .auth { max-width: 980px; margin: 7vh auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
    .hero { padding: 34px; min-height: 430px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .hero h1 { font-size: 46px; line-height: 1.08; margin: 18px 0 10px; }
    .muted { color: var(--muted); line-height: 1.8; }
    .notice { background: #fff8e9; border: 1px solid #f0d7aa; color: #5c4113; padding: 12px; border-radius: 8px; line-height: 1.8; }
    .ok { background: var(--green-2); border: 1px solid #acd8b8; color: #14532d; padding: 12px; border-radius: 8px; line-height: 1.8; }

    h1, h2, h3 { margin: 0 0 12px; }
    .stepper { display: flex; gap: 8px; margin: 12px 0 18px; flex-wrap: wrap; }
    .step { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; color: var(--muted); background: rgba(255,255,255,.7); box-shadow: none; }
    .step:hover { transform: none; box-shadow: none; border-color: #aac9b6; }
    .step.active { background: var(--green); color: white; border-color: var(--green); }
    .step:disabled { opacity: .45; cursor: default; }
    .metric {
      background: linear-gradient(180deg, #ffffff, #fbfdf8);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      min-height: 82px;
      box-shadow: 0 8px 20px rgba(32,40,28,.05);
    }
    .metric small { display: block; color: var(--muted); margin-bottom: 5px; }
    .metric b { display: block; font-size: 24px; }
    .metric.good b { color: var(--green); }
    .metric.warn b { color: var(--amber); }
    .metric.bad b { color: var(--red); }
    .metrics-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .metric.summary {
      min-height: 118px;
      display: grid;
      grid-template-columns: 1fr 68px;
      gap: 10px;
      align-items: center;
    }
    .metric.summary small { margin-bottom: 7px; }
    .metric.summary b { font-size: 22px; }
    .metric.summary .tiny { display: block; margin-top: 6px; }
    .metric-ring {
      width: 62px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--status) var(--p), #e9eee5 0);
      color: var(--ink);
      font-weight: 900;
      position: relative;
    }
    .metric-ring::after {
      content: "";
      width: 42px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      position: absolute;
      box-shadow: inset 0 0 0 1px rgba(221,230,216,.8);
    }
    .metric-ring span { position: relative; z-index: 1; font-size: 13px; }
    .metric.summary.good { --status: var(--green); }
    .metric.summary.warn { --status: var(--amber); }
    .metric.summary.bad { --status: var(--red); }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px; text-align: right; font-size: 13px; vertical-align: middle; }
    th { background: #164e63; color: white; font-weight: 800; }
    tr:last-child td { border-bottom: 0; }
    .tiny { font-size: 12px; color: var(--muted); }
    .food-list { display: grid; gap: 8px; max-height: 560px; overflow: auto; padding-left: 4px; }
    .food-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdf8);
      border-radius: 8px;
      padding: 10px;
      cursor: grab;
      box-shadow: 0 8px 18px rgba(32,40,28,.05);
      transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .food-card:hover { border-color: #9ec7ad; transform: translateY(-1px); box-shadow: 0 12px 26px rgba(32,40,28,.09); }
    .food-card b { display: block; color: #164e63; }
    .food-card small { color: var(--muted); line-height: 1.7; }
    .food-actions { display: flex; gap: 7px; margin-top: 9px; }
    .food-actions button { padding: 7px 9px; font-size: 12px; }
    .food-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .dropzone {
      border: 2px dashed #b8c8bd;
      border-radius: 8px;
      padding: 12px;
      background: linear-gradient(135deg, #f7faf5, #eef7fb);
      text-align: center;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .dropzone.hot { border-color: var(--green); background: var(--green-2); color: var(--green); }
    .entry-grid { display: grid; grid-template-columns: 2fr 100px repeat(6, 1fr) 42px; gap: 8px; align-items: end; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .tabs button { background: #edf3ec; color: var(--ink); }
    .tabs button.active { background: var(--green); color: white; }
    .food-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .food-tabs button { padding: 8px 10px; font-size: 12px; background: #edf3ec; color: var(--ink); box-shadow: none; }
    .food-tabs button.active { background: var(--green); color: white; }
    .recipe-builder { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; align-items: start; }
    .ingredient-list { display: grid; gap: 8px; max-height: 430px; overflow: auto; padding-left: 4px; }
    .ingredient-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdf8);
      border-radius: 8px;
      padding: 9px;
      cursor: grab;
    }
    .ingredient-card b { display: block; color: #164e63; }
    .ingredient-card small { color: var(--muted); line-height: 1.7; }
    .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    svg { width: 100%; height: 240px; background: linear-gradient(180deg, #ffffff, #fbfcf8); border: 1px solid var(--line); border-radius: 8px; }
    .axis { stroke: #d6ddd2; stroke-dasharray: 3 3; }
    .actual { fill: none; stroke: var(--blue); stroke-width: 3; }
    .target { fill: none; stroke: var(--red); stroke-width: 2.4; }
    .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 6px; }
    .legend i { width: 22px; height: 3px; display: inline-block; margin-left: 6px; vertical-align: middle; }
    .water { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .water button { background: white; color: var(--blue); border: 1px solid var(--line); aspect-ratio: 1; padding: 0; }
    .water button.on { background: #dff1ff; border-color: #8fc8ec; }
    .date-strip { display: grid; grid-template-columns: 42px 1fr 42px; gap: 10px; align-items: stretch; margin: 10px 0 16px; }
    .date-strip > button { padding: 0; font-size: 22px; }
    .date-rail { display: grid; grid-template-columns: repeat(9, minmax(86px, 1fr)); gap: 8px; overflow-x: auto; direction: ltr; }
    .day-card { background: rgba(255,255,255,.75); color: var(--ink); border: 1px solid var(--line); box-shadow: none; padding: 8px; min-height: 68px; direction: rtl; }
    .day-card.active { background: linear-gradient(135deg, var(--green), #2f8a62); color: white; border-color: var(--green); }
    .day-card small, .day-card span { display: block; font-size: 11px; }
    .day-card span { margin-top: 5px; font-weight: 900; }
    .tracker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .tracker {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: linear-gradient(180deg, #fff, #fbfdf8);
    }
    .tracker-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 9px; }
    .tracker-head b { font-size: 14px; }
    .tracker-head span { color: var(--muted); font-size: 12px; }
    .tracker-control { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; }
    .tracker input[type="range"] { padding: 0; accent-color: var(--green); }
    .tracker.good input[type="range"] { accent-color: var(--green); }
    .tracker.warn input[type="range"] { accent-color: var(--amber); }
    .tracker.bad input[type="range"] { accent-color: var(--red); }
    .quick-range { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .quick-range button { padding: 8px 10px; font-size: 12px; }
    .chart-tools { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: start; }
    .chart-picker {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.74);
      padding: 12px;
    }
    .chart-picker h3 { font-size: 15px; margin-bottom: 8px; }
    .chart-choice { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
    .chart-choice input { width: auto; accent-color: var(--green); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 20, .42); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .modal { width: min(720px, 100%); max-height: 92vh; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.24); }
    .modal.wide { width: min(1080px, 100%); }
    .recipe-row { display: grid; grid-template-columns: minmax(220px, 1fr) 110px 42px; gap: 8px; align-items: end; margin: 8px 0; }
    .recipe-row button { padding: 10px 0; }
    .recipe-summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
    .recipe-summary div { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 9px; }
    .recipe-summary small { display: block; color: var(--muted); margin-bottom: 4px; }
    .axis-label { fill: #66736d; font-size: 11px; direction: ltr; }
    .axis-value { fill: #46534b; font-size: 11px; direction: ltr; }
    .hidden { display: none !important; }
    .visual-stack { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; margin-top: 26px; }
    .hero-panel {
      min-height: 172px;
      border: 1px solid rgba(221,230,216,.9);
      border-radius: 8px;
      background: rgba(255,255,255,.74);
      padding: 14px;
      box-shadow: 0 16px 34px rgba(32,40,28,.08);
    }
    .hero-bars { display: grid; align-items: end; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; direction: ltr; }
    .hero-bars i { display: block; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--blue), var(--mint)); min-height: 20px; }
    .hero-rings { display: grid; gap: 10px; }
    .ring-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
    .ring {
      width: 52px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--green) var(--p), #e8eee3 0);
      color: var(--ink);
      font-weight: 900;
    }
    .ring::after {
      content: "";
      width: 34px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      position: absolute;
    }
    .ring { position: relative; }
    .ring span { position: relative; z-index: 1; font-size: 12px; }
    .chart-card { background: rgba(255,255,255,.72); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    .chart-card h3 { display: flex; align-items: center; gap: 8px; }
    .chart-card h3::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--green)); display: inline-block; }

    @media (max-width: 1050px) {
      .auth, .workspace, .grid, .grid-3, .grid-4, .charts, .metrics-board, .chart-tools, .recipe-builder { grid-template-columns: 1fr; }
      .entry-grid { grid-template-columns: 1fr 1fr; }
      .hero h1 { font-size: 34px; }
      .brand { font-size: 28px; }
      .app { padding: 14px; }
    }
  </style>
</head>

    function analyze(profile) {
      const heightM = profile.height / 100;
      const bmi = profile.weight / (heightM * heightM);
      const idealLow = 18.5 * heightM * heightM;
      const idealHigh = 24.9 * heightM * heightM;
      const idealTarget = 22 * heightM * heightM;
      const extra = Math.max(0, profile.weight - idealHigh);
      const bmr = 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + (profile.gender === "female" ? -161 : 5);
      const activity = profile.exerciseNow >= 45 ? 1.5 : profile.stepsNow >= 10000 ? 1.45 : profile.stepsNow >= 8000 ? 1.38 : profile.stepsNow >= 6000 ? 1.3 : 1.22;
      const maintenance = bmr * activity;
      const safeMonthly = extra <= 0 ? 0 : Math.min(Math.max(profile.weight * 0.025, 1), 3);
      const deficit = safeMonthly ? safeMonthly * 7700 / 30 : 0;
      const calories = Math.max(profile.gender === "female" ? 1200 : 1500, Math.round(maintenance - deficit));
      const protein = Math.round(Math.max(1.6 * idealTarget, 1.2 * profile.weight));
      const fat = Math.round(Math.max(45, calories * 0.27 / 9));
      const carbs = Math.round(Math.max(90, (calories - protein * 4 - fat * 9) / 4));
      const category = bmi < 18.5 ? "کم‌وزن" : bmi < 25 ? "در بازه نرمال" : bmi < 30 ? "اضافه‌وزن" : "چاقی";
      const steps = profile.stepsNow >= 10000 ? 10000 : profile.stepsNow >= 8000 ? 9000 : profile.stepsNow >= 6000 ? 8000 : 6500;
      const exercise = profile.exerciseNow >= 30 ? profile.exerciseNow : 30;
      return { bmi, idealLow, idealHigh, idealTarget, extra, maintenance, safeMonthly, calories, protein, fat, carbs, fiber: 30, waterGlasses: 8, steps, exercise, category };
    }

          <p class="muted">تو فقط سه چیز را مشخص کن: کاهش وزن ماهانه، قدم روزانه و مدت ورزش. کالری، پروتئین، چربی، کربوهیدرات و فیبر را من بر اساس مشخصات بدنت زنده حساب می‌کنم.</p>
          <div class="grid-3">
            <div><label>از تاریخ</label><input id="effectiveFrom" type="date" value="${isoToday()}"></div>
            <div><label>کاهش وزن ماهانه (kg)</label><input id="monthlyLoss" type="number" step="0.1" value="${current.monthlyLoss || (state.analysis?.safeMonthly || 1.5)}" oninput="previewGoal()"></div>
            <div><label>قدم روزانه</label><input id="goalSteps" type="number" value="${current.steps || 8000}" oninput="previewGoal()"></div>
            <div><label>ورزش روزانه (دقیقه)</label><input id="goalExercise" type="number" value="${current.exercise || 30}" oninput="previewGoal()"></div>
          </div>
          <div id="goalPreview" style="margin-top:14px"></div>
          <button style="margin-top:14px" onclick="saveEditedPlan()">ذخیره هدف از این تاریخ</button>
        </section>`);
      previewGoal();
    }

    function saveEditedPlan() {
      addPlanVersion(buildPlanFromInputs());
      save();
      showApp();
    }

    function buildPlanFromInputs() {
      const p = {
        monthlyLoss: Number($("#monthlyLoss").value),
        steps: Number($("#goalSteps").value),
        exercise: Number($("#goalExercise").value)
      };
      const computed = planFromActivity(state.profile, p.monthlyLoss, p.steps, p.exercise);
      return { effectiveFrom: $("#effectiveFrom").value, monthlyLoss: p.monthlyLoss, ...computed };
    }

    function previewGoal() {
      const p = buildPlanFromInputs();
      $("#goalPreview").innerHTML = `<div class="grid-4">
        <div class="metric"><small>کالری</small><b>${f(p.calories)} kcal</b></div>
        <div class="metric"><small>پروتئین</small><b>${f(p.protein)} g</b></div>
        <div class="metric"><small>چربی</small><b>${f(p.fat)} g</b></div>
        <div class="metric"><small>کربوهیدرات</small><b>${f(p.carbs)} g</b></div>
        <div class="metric"><small>فیبر</small><b>${f(p.fiber)} g</b></div>
        <div class="metric"><small>آب</small><b>${f(p.waterGlasses)} لیوان</b></div>
        <div class="metric"><small>قدم</small><b>${f(p.steps)}</b></div>
        <div class="metric"><small>ورزش</small><b>${f(p.exercise)} دقیقه</b></div>
      </div>`;
    }

    function planFromActivity(profile, monthlyLoss, steps, exercise) {
      const heightM = profile.height / 100;
      const idealTarget = 22 * heightM * heightM;
      const bmr = 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + (profile.gender === "female" ? -161 : 5);
      const activity = steps >= 10000 ? 1.48 : steps >= 8000 ? 1.4 : steps >= 6500 ? 1.32 : 1.22;
      const exerciseBoost = Math.min(0.12, Math.max(0, exercise - 20) / 250);
      const maintenance = bmr * (activity + exerciseBoost);
      const calories = Math.max(profile.gender === "female" ? 1200 : 1500, Math.round(maintenance - Math.max(0, monthlyLoss) * 7700 / 30));
      const protein = Math.round(Math.max(1.6 * idealTarget, 1.2 * profile.weight));
      const fat = Math.round(Math.max(45, calories * 0.27 / 9));
      const carbs = Math.round(Math.max(90, (calories - protein * 4 - fat * 9) / 4));
      return { calories, protein, fat, carbs, fiber: 30, waterGlasses: 8, steps, exercise };
    }

    function addPlanVersion(plan) {
      state.plans = (state.plans || []).filter(p => p.effectiveFrom !== plan.effectiveFrom);
      state.plans.push(plan);
      state.plans.sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
      state.plan = plan;
    }

    function currentPlanFor(date) {
      const plans = [...(state.plans || [])].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
      if (!plans.length) return state.plan;
      return plans.filter(p => p.effectiveFrom <= date).pop() || plans[0];
    }

    function currentLog() {
      state.logs[state.currentDate] ||= { date: state.currentDate, entries: [], water: 0, steps: 0, exercise: 0, weight: "" };
      return state.logs[state.currentDate];
    }

    function totals(log = currentLog()) {
      return log.entries.reduce((sum, e) => {
        const food = foods.find(x => x.id === e.foodId);
        if (!food) return sum;
        const u = Number(e.units || 0);
        sum.cal += food.cal * u;
        sum.protein += food.protein * u;
        sum.fat += food.fat * u;
        sum.carbs += food.carbs * u;
        sum.fiber += food.fiber * u;
        sum.foodWater += food.water * u;
        return sum;
      }, { cal: 0, protein: 0, fat: 0, carbs: 0, fiber: 0, foodWater: 0 });
    }

    function showApp() {
      const log = currentLog();
      const t = totals(log);
      const plan = currentPlanFor(state.currentDate);
      page(`${topbar(`<button class="ghost" onclick="showProfile()">اصلاح پروفایل</button>`)}${steps(5)}
        <div id="dailyMetrics" class="metrics-board">${dailyMetrics()}</div>
        <div class="workspace" style="margin-top:16px">
          <aside class="card">
            <h2>دیتابیس غذا</h2>
            <p class="muted">روی غذا کلیک کن یا کارت را بکش داخل لاگ. غذای جدید هم می‌توانی به دیتابیس اضافه کنی.</p>
            <label>جستجو</label><input id="foodSearch" oninput="renderFoods()" placeholder="مثلاً مرغ، برنج، سیب">
            <div class="food-buttons">
              <button class="secondary" onclick="openFoodModal()">افزودن غذای جدید</button>
              <button onclick="openRecipeModal()">آشپزی</button>
            </div>
            <div id="foodTabs" class="food-tabs">${foodTabs()}</div>
            <div id="foodList" class="food-list" style="margin-top:12px"></div>
          </aside>
          <section>
            <div class="card">
              <div class="grid">
                <div><label>تاریخ</label><input id="datePicker" type="date" value="${state.currentDate}" onchange="changeDate(this.value)"></div>
                <div><label>تعداد پیش‌فرض از واحد غذا</label><input id="defaultUnits" type="number" step="0.1" value="1"></div>
              </div>
              ${dateStrip()}
              <div id="dropzone" class="dropzone">غذا را اینجا رها کن یا از دیتابیس کلیک کن</div>
              <div id="entries"></div>
              <h3 style="margin-top:16px">آب، قدم، ورزش و وزن</h3>
              <div class="tracker-grid">
                ${tracker("water", "لیوان آب", log.water || 0, plan.waterGlasses || 8, "لیوان", 1)}
                ${tracker("steps", "قدم امروز", log.steps || 0, plan.steps || 8000, "قدم", 100)}
                ${tracker("exercise", "ورزش امروز", log.exercise || 0, plan.exercise || 30, "دقیقه", 5)}
              </div>
              <div class="grid-3" style="margin-top:12px">
                <div><label>وزن امروز (kg)</label><input id="weightInput" type="number" step="0.1" value="${log.weight || ""}" onchange="setDaily('weight', this.value)"></div>
              </div>
            </div>
            <div class="card" style="margin-top:16px">
              <div class="grid">
                <div><label>شروع نمودار</label><input id="chartFrom" type="date" value="${state.chartRange.from || addDays(state.currentDate, -30)}" onchange="setChartRangeFromInputs()"></div>
                <div><label>پایان نمودار</label><input id="chartTo" type="date" value="${state.chartRange.to || state.currentDate}" onchange="setChartRangeFromInputs()"></div>
              </div>
              <div class="quick-range">
                <button class="secondary" onclick="quickRange(7)">هفته گذشته</button>
                <button class="secondary" onclick="quickRange(30)">ماه گذشته</button>
                <button class="secondary" onclick="quickRange(90)">سه ماه گذشته</button>
                <button class="secondary" onclick="quickRange(365)">سال گذشته</button>
                <button class="ghost" onclick="setChartRangeFromInputs()">اعمال بازه</button>
              </div>
              <div class="chart-tools" style="margin-top:14px">
                <aside class="chart-picker">
                  <h3>انتخاب نمودار</h3>
                  <div id="chartPicker">${chartPicker()}</div>
                </aside>
                <div id="charts" class="charts"></div>
              </div>
            </div>
          </section>
        </div>`);
      renderFoods();
      renderEntries();
      renderCharts();
      setupDropzone();
    }

    function dailyMetrics() {
      const log = currentLog();
      const t = totals(log);
      const plan = currentPlanFor(state.currentDate);
      return [
        metric("کالری", t.cal, plan.calories, "kcal"),
        metric("پروتئین", t.protein, plan.protein, "g"),
        metric("چربی", t.fat, plan.fat, "g"),
        metric("کربوهیدرات", t.carbs, plan.carbs, "g"),
        metric("فیبر", t.fiber, plan.fiber, "g"),
        metric("آب", log.water, plan.waterGlasses, "لیوان"),
        metric("قدم", log.steps, plan.steps, ""),
        metric("ورزش", log.exercise, plan.exercise, "دقیقه")
      ].join("");
    }

    function renderDailyMetrics() {
      const board = $("#dailyMetrics");
      if (board) board.innerHTML = dailyMetrics();
    }

    function metric(label, actual, target, unit) {
      const ratio = target ? actual / target : 0;
      const isCalories = label === "کالری";
      const cls = isCalories
        ? (ratio > 1.05 ? "bad" : ratio >= .85 ? "good" : "warn")
        : (ratio >= 1 ? "good" : "warn");
      const percent = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      const digits = label === "قدم" || label === "ورزش" || label === "آب" ? 0 : 1;
      return `<div class="metric summary ${cls}">
        <div>
          <small>${label}</small>
          <b>${f(actual, digits)} ${unit}</b>
          <span class="tiny">هدف: ${f(target, 0)} ${unit}</span>
        </div>
        <div class="metric-ring" style="--p:${percent}%"><span>${percent}</span></div>
      </div>`;
    }

    function tracker(key, label, value, target, unit, step) {
      const max = Math.max(step, Number(target || 0) * 2);
      const ratio = target ? Number(value || 0) / target : 0;
      const cls = ratio >= .85 && ratio <= 1.25 ? "good" : ratio >= .45 ? "warn" : "bad";
      return `<div class="tracker ${cls}" id="${key}Tracker">
        <div class="tracker-head"><b>${label}</b><span>هدف: ${f(target, 0)} ${unit}</span></div>
        <div class="tracker-control">
          <input id="${key}Number" type="number" min="0" max="${max}" step="${step}" value="${value}" oninput="syncDaily('${key}', this.value)">
          <input id="${key}Range" type="range" min="0" max="${max}" step="${step}" value="${value}" oninput="syncDaily('${key}', this.value)">
        </div>
      </div>`;
    }

    function dateStrip() {
      const days = dateRange(addDays(state.currentDate, -4), addDays(state.currentDate, 4));
      return `<div class="date-strip">
        <button class="secondary" onclick="shiftDate(-1)">‹</button>
        <div class="date-rail">
          ${days.map(date => {
            const total = totals(state.logs[date] || { entries: [] }).cal;
            return `<button class="day-card ${date === state.currentDate ? "active" : ""}" onclick="changeDate('${date}')">
              <small>${weekday(date)} ${date.slice(5)}</small>
              <span>${f(total, 0)} kcal</span>
            </button>`;
          }).join("")}
        </div>
        <button class="secondary" onclick="shiftDate(1)">›</button>
      </div>`;
    }

    function weekday(date) {
      return new Date(date + "T12:00:00").toLocaleDateString("fa-IR", { weekday: "short" });
    }

    function addDays(date, days) {
      const d = new Date(date + "T12:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    }

    function isCustomFood(id) {
      return state.customFoods.some(food => food.id === id);
    }

    function inferFoodCategory(id, name) {
      if (id <= 6 || [61,62,63,64,65,66,67,68,69].includes(id)) return "fruit";
      if ([34,35,36,37,38,39,40,46,49,50,58,70,71,72,73,74,75,76].includes(id)) return "vegetable";
      if ([14,15,16,17,18,19,20,47,48,51,77,78,79,80,81,82].includes(id)) return "protein";
      if ([21,22,23,24,41,42,83,84,85,86].includes(id)) return "dairy";
      if ([7,8,9,10,11,12,13,52,53,55,87,88,89,90,91].includes(id)) return "grain";
      if ([25,26,27,28,59,92,93,94,95].includes(id)) return "legume";
      if ([29,30,31,32,33,96,97,98,99,100,101,102].includes(id)) return "fat";
      if ([56,57,60,103,104,105,106,107,108,109,110,111,112,113,114].includes(id)) return "meal";
      if ([43,44,45,54,115,116,117,118].includes(id)) return "sweet";
      if ([119,120].includes(id)) return "drink";
      return "meal";
    }

    function roundFoodValue(value) {
      return Math.round(Number(value || 0) * 10) / 10;
    }

    function inferFoodServing(id, name, category) {
      const byId = {
        1: ["۱ عدد متوسط", 1.82],
        2: ["۱ عدد متوسط", 1.18],
        3: ["۱ عدد متوسط", 1.31],
        4: ["۱ پیمانه", 1.52],
        5: ["۱ برش متوسط", 2.8],
        6: ["۱ عدد", 0.08],
        19: ["۱ عدد", 0.5],
        20: ["سفیده ۱ تخم‌مرغ", 0.33],
        23: ["۱ لیوان", 2],
        32: ["۱ قاشق غذاخوری", 0.135],
        42: ["۱ لیوان", 2],
        43: ["۱ قاشق غذاخوری", 0.21],
        51: ["۱ اسکوپ", 0.3],
        61: ["۱ پیمانه", 1.51],
        62: ["۱ عدد", 0.75],
        63: ["۱ عدد متوسط", 1.78],
        64: ["۱ عدد متوسط", 1.5],
        65: ["۱ عدد", 0.35],
        66: ["۱ عدد متوسط", 2.82],
        67: ["۱ پیمانه", 1.6],
        68: ["۱ پیمانه", 1.65],
        69: ["۱ پیمانه", 1.48],
        83: ["۱ لیوان", 2],
        86: ["۱ لیوان", 2],
        99: ["۱ قاشق غذاخوری", 0.1],
        100: ["۱ قاشق غذاخوری", 0.12],
        101: ["۱ قاشق غذاخوری", 0.09],
        102: ["۱ قاشق غذاخوری", 0.14],
        103: ["۱ عدد", 1.2],
        104: ["۱ کاسه", 2.5],
        105: ["۱ کاسه", 2],
        106: ["۱ کاسه", 2],
        107: ["۱ پرس", 3.5],
        108: ["۱ پرس", 3.5],
        109: ["۱ کاسه", 3],
        110: ["۱ کاسه", 2.5],
        111: ["۱ کاسه", 2],
        112: ["۱ عدد", 1.8],
        113: ["۱ بشقاب", 2.5],
        114: ["۱ برش", 2],
        116: ["۱ پیمانه", 1.32],
        117: ["۱ برش", 0.8],
        118: ["۱ عدد", 0.12],
        119: ["۱ لیوان", 2],
        120: ["۱ لیوان", 2]
      };
      if (byId[id]) return { unit: byId[id][0], factor: byId[id][1] };
      if (category === "drink") return { unit: "۱ لیوان", factor: 2 };
      if (category === "meal") return { unit: "۱ پرس", factor: 3 };
      return { unit: "۱۰۰ گرم", factor: 1 };
    }

    function getFoodCategory(food) {
      return food.category || inferFoodCategory(food.id, food.name);
    }

    function foodUnit(food) {
      return food?.unit || "۱۰۰ گرم";
    }

    function knownUnits() {
      return ["۱۰۰ گرم", "۱ عدد", "۱ عدد متوسط", "۱ لیوان", "۱ پیمانه", "۱ قاشق غذاخوری", "۱ قاشق چای‌خوری", "۱ کاسه", "۱ بشقاب", "۱ پرس", "۱ برش", "۱ کفگیر", "۱ اسکوپ"];
    }

    function isKnownUnit(unit) {
      return knownUnits().includes(unit || "۱۰۰ گرم");
    }

    function unitOptions(selected) {
      const active = isKnownUnit(selected) ? selected : "۱۰۰ گرم";
      return knownUnits().map(unit => `<option value="${unit}" ${unit === active ? "selected" : ""}>${unit}</option>`).join("");
    }

    function foodTabs() {
      const active = state.foodTab || "all";
      return foodCategories.map(([key, label]) => `<button class="${active === key ? "active" : ""}" onclick="setFoodTab('${key}')">${label}</button>`).join("");
    }

    function setFoodTab(key) {
      state.foodTab = key;
      save();
      const tabs = $("#foodTabs");
      if (tabs) tabs.innerHTML = foodTabs();
      renderFoods();
    }

    function renderFoods() {
      const q = ($("#foodSearch")?.value || "").trim();
      const active = state.foodTab || "all";
      const list = foods.filter(food => {
        const matchesSearch = !q || food.name.includes(q) || String(food.id) === q;
        const matchesTab = active === "all" || (active === "custom" ? isCustomFood(food.id) : getFoodCategory(food) === active);
        return matchesSearch && matchesTab;
      }).slice(0, 120);
      if (!list.length) {
        $("#foodList").innerHTML = `<div class="notice">در این دسته هنوز غذایی پیدا نشد.</div>`;
        return;
      }
      $("#foodList").innerHTML = list.map(food => `<div class="food-card" draggable="true" ondragstart="dragFood(event, ${food.id})" onclick="addFood(${food.id})">
        <b>${food.id}. ${esc(food.name)}</b>
        <small>${categoryLabel(getFoodCategory(food))} | واحد: ${foodUnit(food)} | ${food.cal} kcal | پروتئین ${food.protein}g | فیبر ${food.fiber}g</small>
        <div class="food-actions">
          <button class="ghost" onclick="event.stopPropagation(); openFoodModal(${food.id})">ویرایش</button>
          ${isCustomFood(food.id) ? `<button class="danger" onclick="event.stopPropagation(); deleteFood(${food.id})">حذف</button>` : ""}
        </div>
      </div>`).join("");
    }

    function categoryLabel(key) {
      return foodCategories.find(([id]) => id === key)?.[1] || "غذا";
    }

    function dragFood(event, id) {
      event.dataTransfer.setData("foodId", String(id));
    }

    function setupDropzone() {
      const z = $("#dropzone");
      z.ondragover = (event) => { event.preventDefault(); z.classList.add("hot"); };
      z.ondragleave = () => z.classList.remove("hot");
      z.ondrop = (event) => {
        event.preventDefault();
        z.classList.remove("hot");
        addFood(Number(event.dataTransfer.getData("foodId")));
      };
    }

    function addFood(foodId) {
      if (!foods.find(x => x.id === foodId)) return;
      currentLog().entries.push({ foodId, units: Number($("#defaultUnits")?.value || 1) });
      save();
      showApp();
    }

    function renderEntries() {
      const log = currentLog();
      if (!log.entries.length) {
        $("#entries").innerHTML = `<div class="notice">هنوز غذایی برای این روز ثبت نشده.</div>`;
        return;
      }
      $("#entries").innerHTML = `<table>
        <tr><th>غذا</th><th>تعداد</th><th>واحد</th><th>کالری</th><th>پروتئین</th><th>چربی</th><th>کربوهیدرات</th><th>فیبر</th><th></th></tr>
        ${log.entries.map((entry, index) => {
          const food = foods.find(x => x.id === entry.foodId);
          if (!food) return "";
          const u = Number(entry.units || 0);
          return `<tr>
            <td>${food.id}. ${esc(food.name)}</td>
            <td><input type="number" step="0.1" value="${u}" onchange="setUnits(${index}, this.value)"></td>
            <td>${esc(foodUnit(food))}</td>
            <td>${f(food.cal * u, 1)}</td>
            <td>${f(food.protein * u, 1)}</td>
            <td>${f(food.fat * u, 1)}</td>
            <td>${f(food.carbs * u, 1)}</td>
            <td>${f(food.fiber * u, 1)}</td>
            <td><button class="danger" onclick="removeEntry(${index})">حذف</button></td>
          </tr>`;
        }).join("")}
      </table>`;
    }

    function setUnits(index, value) {
      currentLog().entries[index].units = Number(value);
      save();
      showApp();
    }

    function removeEntry(index) {
      currentLog().entries.splice(index, 1);
      save();
      showApp();
    }

    function setWater(count) {
      currentLog().water = count;
      save();
      showApp();
    }

    function setDaily(key, value, quiet = false) {
      currentLog()[key] = key === "weight" ? value : Number(value);
      save();
      if (!quiet) showApp();
    }

    function syncDaily(key, value) {
      const number = Number(value || 0);
      currentLog()[key] = number;
      const numberInput = $(`#${key}Number`);
      const rangeInput = $(`#${key}Range`);
      if (numberInput && numberInput.value !== String(value)) numberInput.value = value;
      if (rangeInput && rangeInput.value !== String(value)) rangeInput.value = value;
      const plan = currentPlanFor(state.currentDate);
      const target = key === "water" ? plan.waterGlasses : plan[key];
      const ratio = target ? number / target : 0;
      const cls = ratio >= .85 && ratio <= 1.25 ? "good" : ratio >= .45 ? "warn" : "bad";
      const box = $(`#${key}Tracker`);
      if (box) box.className = `tracker ${cls}`;
      save();
      renderDailyMetrics();
      renderCharts();
    }

    function changeDate(value) {
      state.currentDate = value;
      save();
      showApp();
    }

    function shiftDate(days) {
      changeDate(addDays(state.currentDate, days));
    }

    function setChartRangeFromInputs() {
      state.chartRange = {
        from: $("#chartFrom")?.value || state.chartRange?.from || state.currentDate,
        to: $("#chartTo")?.value || state.chartRange?.to || state.currentDate
      };
      save();
      renderCharts();
    }

    function quickRange(days) {
      const end = state.currentDate || isoToday();
      state.chartRange = { from: addDays(end, -(days - 1)), to: end };
      const fromInput = $("#chartFrom");
      const toInput = $("#chartTo");
      if (fromInput) fromInput.value = state.chartRange.from;
      if (toInput) toInput.value = state.chartRange.to;
      save();
      renderCharts();

    function dailyRows() {
      return Object.values(state.logs).sort((a, b) => a.date.localeCompare(b.date)).map(log => {
        const t = totals(log);
        return { date: log.date, ...t, water: log.water || 0, steps: log.steps || 0, exercise: log.exercise || 0, weight: Number(log.weight || 0) };
      });
    }

    function chartDefinitions() {
      return [

        ["fat", "چربی", "fat", "fat"],
        ["carbs", "کربوهیدرات", "carbs", "carbs"],
        ["fiber", "فیبر", "fiber", "fiber"],

    function defaultChartKeys() {

    function chartPicker() {
      const selected = new Set(state.visibleCharts || defaultChartKeys());
      return chartDefinitions().map(([key, title]) => `<label class="chart-choice">

    function toggleChart(key, checked) {
      const selected = new Set(state.visibleCharts || defaultChartKeys());
      if (checked) selected.add(key);
      else selected.delete(key);

      save();

    function renderCharts() {
      const rows = chartRows();
      const selected = new Set(state.visibleCharts || defaultChartKeys());
      const chosen = chartDefinitions().filter(([id]) => selected.has(id));
      $("#charts").innerHTML = chosen.length
        ? chosen.map(([, title, key, target]) => chart(title, rows, key, target)).join("")
        : `<div class="notice">هیچ نموداری انتخاب نشده. از سمت چپ حداقل یکی را تیک بزن.</div>`;
    }

    function chartRows() {
      const logged = dailyRows();
      const dates = logged.map(r => r.date);
      const first = state.chartRange?.from || $("#chartFrom")?.value || dates[0] || state.currentDate || isoToday();
      const last = state.chartRange?.to || $("#chartTo")?.value || dates.at(-1) || state.currentDate || isoToday();
      const from = first <= last ? first : last;
      const to = first <= last ? last : first;
      const byDate = Object.fromEntries(logged.map(r => [r.date, r]));
      return dateRange(from, to).map(date => byDate[date] || {
        date,
        cal: 0,
        protein: 0,
        fat: 0,
        carbs: 0,
        fiber: 0,
        foodWater: 0,
        water: 0,
        steps: 0,
        exercise: 0,
        weight: 0
      });
    }

    function dateRange(from, to) {
      const out = [];
      const d = new Date(from + "T12:00:00");
      const end = new Date(to + "T12:00:00");
      let guard = 0;
      while (d <= end && guard < 370) {
        out.push(d.toISOString().slice(0, 10));
        d.setDate(d.getDate() + 1);
        guard++;
      }
      return out;
    }

    function chart(title, rows, key, targetKey) {
      const targetValues = targetKey ? rows.map(r => Number(currentPlanFor(r.date)?.[targetKey] || 0)) : [];
      const max = niceMax(Math.max(1, ...rows.map(r => Number(r[key] || 0)), ...targetValues));
      const plotLeft = 72;
      const plotRight = 610;
      const plotTop = 34;
      const plotBottom = 205;
      const x = (i) => plotLeft + i * ((plotRight - plotLeft) / Math.max(1, rows.length - 1));
      const y = (v) => plotBottom - (Number(v || 0) / max) * (plotBottom - plotTop);
      const actual = rows.map((r, i) => `${x(i)},${y(r[key])}`).join(" ");
      const goalLine = targetKey && rows.length ? `<polyline class="target" points="${stepPoints(rows, x, y, targetKey)}"/>` : "";
      const ticks = [0, .25, .5, .75, 1].map(part => {
        const value = max * part;
        const yy = y(value);
        return `<line class="axis" x1="${plotLeft}" y1="${yy}" x2="${plotRight}" y2="${yy}"></line><text class="axis-value" x="${plotLeft - 10}" y="${yy + 4}" text-anchor="end">${f(value, value < 10 ? 1 : 0)}</text>`;
      }).join("");
      const xLabels = rows.length ? rows
        .map((r, i) => ({ r, i }))
        .filter(({ i }) => rows.length <= 5 || i === 0 || i === rows.length - 1 || i === Math.floor((rows.length - 1) / 2) || i === Math.floor((rows.length - 1) / 4) || i === Math.floor((rows.length - 1) * 3 / 4))
        .map(({ r, i }) => `<text class="axis-label" x="${x(i)}" y="225" text-anchor="middle">${r.date.slice(5)}</text>`)
        .join("") : "";
      return `<div class="chart-card">
        <h3>${title}</h3>
        <svg viewBox="0 0 630 235" role="img" aria-label="نمودار ${title}">
          ${ticks}
          <line class="axis" x1="${plotLeft}" y1="${plotTop}" x2="${plotLeft}" y2="${plotBottom}"></line>
          ${goalLine}
          <polyline class="actual" points="${actual}"></polyline>
          ${xLabels}
        </svg>
        <div class="legend"><span><i style="background:var(--blue)"></i>مصرف</span>${targetKey ? `<span><i style="background:var(--red)"></i>هدف</span>` : ""}</div>
      </div>`;
    }

    function stepPoints(rows, x, y, targetKey) {
      const points = [];
      rows.forEach((row, i) => {
        const value = Number(currentPlanFor(row.date)?.[targetKey] || 0);
        if (i === 0) {
          points.push(`${x(i)},${y(value)}`);
        } else {
          const previous = Number(currentPlanFor(rows[i - 1].date)?.[targetKey] || 0);
          points.push(`${x(i)},${y(previous)}`);
          points.push(`${x(i)},${y(value)}`);
        }
      });
      return points.join(" ");
    }

    function niceMax(value) {
      const power = Math.pow(10, Math.floor(Math.log10(value)));
      const normalized = value / power;
      const nice = normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
      return nice * power;
    }

    function calculateRecipe() {
      const rows = [...document.querySelectorAll(".recipe-row")];
      const total = { cal: 0, protein: 0, fat: 0, carbs: 0, fiber: 0, water: 0 };
      const items = [];
      rows.forEach(row => {
        const ingredientId = Number(row.dataset.ingredientId || 0);
        const amount = Number(row.querySelector(".recipeAmount")?.value || 0);
        const ingredient = rawIngredients.find(item => item.id === ingredientId);
        if (!ingredient || amount <= 0) return;
        total.cal += ingredient.cal * amount;
        total.protein += ingredient.protein * amount;
        total.fat += ingredient.fat * amount;
        total.carbs += ingredient.carbs * amount;
        total.fiber += ingredient.fiber * amount;
        total.water += ingredient.water * amount;
        items.push({ ingredientId, amount, name: ingredient.name, unit: ingredient.unit });
      });
      const servings = Math.max(0.1, Number($("#recipeYield")?.value || 1));
      const perUnit = {
        cal: roundFoodValue(total.cal / servings),
        protein: roundFoodValue(total.protein / servings),
        fat: roundFoodValue(total.fat / servings),
        carbs: roundFoodValue(total.carbs / servings),
        fiber: roundFoodValue(total.fiber / servings),
        water: roundFoodValue(total.water / servings)
      };
      return { total, perUnit, servings, items };
    }

    function saveIngredient() {
      const editingId = Number($("#editingIngredientId").value || 0);
      const name = $("#newIngredientName").value.trim();
      if (!name) return;
      const id = editingId || Math.max(0, ...rawIngredients.map(item => item.id)) + 1;
      const item = {
        id,
        name,
        cal: Number($("#newIngredientCal").value || 0),
        protein: Number($("#newIngredientProtein").value || 0),
        fat: Number($("#newIngredientFat").value || 0),
        carbs: Number($("#newIngredientCarbs").value || 0),
        fiber: Number($("#newIngredientFiber").value || 0),
        water: Number($("#newIngredientWater").value || 0),
        unit: $("#newIngredientCustomUnit").value.trim() || $("#newIngredientUnit").value || "۱۰۰ گرم",
        category: $("#newIngredientCategory").value || "protein"
      };
      const existingIndex = rawIngredients.findIndex(x => x.id === id);
      if (existingIndex >= 0) rawIngredients[existingIndex] = item;
      else rawIngredients.push(item);
      if (isCustomIngredient(id) || !editingId) {
        const customIndex = state.customIngredients.findIndex(x => x.id === id);
        if (customIndex >= 0) state.customIngredients[customIndex] = item;
        else state.customIngredients.push(item);
      } else {
        state.ingredientOverrides[id] = item;
      }
      save();
      closeIngredientModal();
      renderIngredients();
      updateRecipePreview();
    }

    function deleteIngredient(id) {
      if (!isCustomIngredient(id)) return;
      if (!confirm("این ماده اولیه حذف شود؟ دستور پخت‌های قبلی که از آن استفاده کرده‌اند، اسم و واحد ذخیره‌شده خودشان را نگه می‌دارند.")) return;
      const index = rawIngredients.findIndex(item => item.id === id);
      if (index >= 0) rawIngredients.splice(index, 1);
      state.customIngredients = state.customIngredients.filter(item => item.id !== id);
      save();
      renderIngredients();
      updateRecipePreview();
    }

    function showLoading() {
      root.innerHTML = `<div class="app"><section class="card" style="max-width:720px;margin:10vh auto"><h2>در حال آماده‌سازی حساب...</h2><p class="muted">چند لحظه صبر کن.</p></section></div>`;
    }

    async function routeAfterAuth() {
      if (!state.profile) showProfile();
      else if (!currentPlanFor(state.currentDate)) showReport();
      else showApp();
    }

    async function boot() {
      showLoading();
      const { data } = await db.auth.getSession();
      if (data.session?.user) {
        try {
          await loadUserState(data.session.user);
          routeAfterAuth();
        } catch (error) {
          console.error(error);
          state = defaultState();
          showAuth();
          setAuthMessage("اتصال به دیتابیس برقرار نشد. چند لحظه بعد دوباره تلاش کن.");
        }
      } else {
        state = defaultState();
        showAuth();
      }
    }

    boot();
  </script>
</body>
</html>
